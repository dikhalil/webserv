# Test invalid values for all directives

http {
    # Valid HTTP block
    root /var/www/html;
    index index.html;
    client_max_body_size 10M;
    
    server {
        # Test 1: Invalid listen port (> 65535)
        listen 99999;
        
        # Test 2: Invalid IP address
        listen 256.1.1.1:8080;
        
        # Test 3: Invalid server_name (empty not allowed)
        server_name example.com;
        
        root /var/www;
        
        location / {
            # Test 4: Invalid HTTP methods
            methods GET POST INVALID_METHOD;
            
            # Test 5: Invalid root path (doesn't exist - optional check)
            root /nonexistent/path;
        }
        
        location /upload {
            # Test 6: Invalid upload value (not on/off)
            upload invalid;
            upload_path /uploads;
        }
        
        location /cgi {
            # Test 7: Invalid cgi value (not on/off)
            cgi maybe;
            cgi_ext .py;
        }
        
        location /redirect {
            # Test 8: Invalid redirect code (not valid HTTP status code)
            return 999 /somewhere;
        }
    }
    
    server {
        listen 8080;
        root /var/www;
        
        # Test 9: Invalid client_max_body_size format
        client_max_body_size 10X;
        
        # Test 10: Invalid error_page code
        error_page 999 /error.html;
        
        location / {
            methods GET;
        }
    }
}
