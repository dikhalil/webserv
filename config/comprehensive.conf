# Comprehensive NGINX-style config test
# Tests all inheritance and validation rules

http {
    # HTTP-level defaults (optional, will be inherited)
    root /var/www/default;
    index index.html index.htm default.html;
    client_max_body_size 5M;
    autoindex off;
    error_page 404 /404.html;
    error_page 500 502 503 /50x.html;
    cgi_bin_path /usr/lib/cgi-bin;
    
    # Server 1: Inherits everything from HTTP
    server {
        listen 9090;
        listen 127.0.0.1:8081 ;
        server_name hkj example.com www.example.com;
        
        # This server inherits: root, index, client_max_body_size, error_pages, cgi_bin_path
        
        location / {
            # Inherits root, index from server (which got them from http)
            methods GET POST;
        }
        
        location /api {
            # Override root
            root /var/www/api;
            methods GET POST DELETE;
        }
        
        location /uploads {
            upload on;
            upload_path /var/www/uploads;
            methods POST DELETE;
        }
        
        location /cgi {
            cgi on;
            cgi_ext .py;
        }
    }
    
    # Server 2: Overrides HTTP defaults
    server {
        listen 9090;
        server_name test.local;
        root /var/www/test;  # Override HTTP root
        index test.html;      # Override HTTP index
        client_max_body_size 10M;  # Override HTTP size
        
        location / {
            methods GET;
        }
        
        location /redirect {
            return 301 https://test.local;
        }
    }
    
    # Server 3: Minimal (relies heavily on inheritance)
    server {
        listen 3000;
        server_name minimal.local;
        
        # Inherits root from HTTP
        
        location / {
            # Everything inherited
        }
    }
}
