http
{
    server
    {
        listen 127.0.0.1:8080;
        listen 127.0.0.1:8081;

        server_name localhost;

        root ./www;
        index index.html;

        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;

        client_max_body_size 10M;

        location /
        {
            methods GET POST DELETE;
            autoindex off;
        }

        location /uploads/
        {
            methods POST;
            upload on;
            upload_path ./www/uploads;
            autoindex off;
        }

        location /cgi-bin/
        {
            methods GET POST;
            cgi on;
            cgi_ext .php;
            autoindex off;
        }
    }
}
