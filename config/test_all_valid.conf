# Comprehensive validation test - all values should be valid

http {
    root /var/www/html;
    index index.html index.htm;
    client_max_body_size 10M;
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    
    server {
        # Valid listen directives
        listen 80;
        listen 127.0.0.1:8080;
        listen 0.0.0.0:3000;
        
        # Valid server names
        server_name example.com www.example.com;
        
        root /var/www/site1;
        
        location / {
            # Valid HTTP methods
            methods GET POST DELETE;
            root /var/www/site1/public;
        }
        
        location /api {
            methods GET POST DELETE;
            index api.html;
        }
        
        location /upload {
            upload on;
            upload_path /var/www/uploads;
            methods POST;
        }
        
        location /cgi-bin {
            cgi on;
            cgi_ext .py;
            methods GET POST;
        }
        
        location /redirect {
            # Valid redirect codes
            return 301 https://example.com;
        }
        
        location /temp-redirect {
            return 302 /temporary-location;
        }
    }
    
    server {
        listen 8080;
        server_name api.example.com;
        root /var/www/api;
        client_max_body_size 5M;
        
        error_page 403 /forbidden.html;
        error_page 404 /not_found.html;
        
        location / {
            methods GET;
        }
    }
}
