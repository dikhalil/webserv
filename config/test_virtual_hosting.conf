# Test: Same IP:port but different server_names (virtual hosting) - Should PASS
http {
    root /var/www;
    
    server {
        listen 127.0.0.1:80;
        server_name example.com;
        
        location / {
            methods GET;
        }
    }
    
    server {
        listen 127.0.0.1:80;
        server_name another.com;
        
        location / {
            methods GET;
        }
    }
}
