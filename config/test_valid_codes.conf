# Test valid HTTP codes
server {
    listen 8080;
    root /var/www;
    
    # Valid error_page codes
    error_page 404 /404.html;
    error_page 500 502 503 /50x.html;
    
    location / {
        methods GET POST DELETE;
    }
    
    location /redirect {
        return 301 /new-location;
    }
}
