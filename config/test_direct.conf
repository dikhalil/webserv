# Test config WITHOUT HTTP block (direct servers)
server {
    listen 8080;
    server_name example.com;
    root /var/www/example;
    index index.html;
    
    location / {
        methods GET POST;
    }
}

server {
    listen 9090;
    server_name test.local;
    root /var/www/test;
    
    location / {
        methods GET;
    }
}
