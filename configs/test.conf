http {
    autoindex on;
    client_max_body_size 0;
        index "index.html" index.html;
    cgi_bin_path "/usr/bin/python3";
    error_page 404 gb;
  server {
       root "./www";
       listen 127.0.0.1:8080;
       index "html/index.html";
       autoindex off;
        server_name diana ;
      location / {
        cgi off;
        cgi_ext js;
        cgi_bin_path /cgi_bin;
      }
    }
}
